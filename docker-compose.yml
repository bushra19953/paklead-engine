# PakLead Engine — single self-contained deployment (TRD NFR-PK-9).
# Free/open-source only: FastAPI + Streamlit + APScheduler + SQLite.
# Copy .env.example to .env before starting. `docker compose up`

services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: python scheduler.py
    restart: unless-stopped

  dashboard:
    build: .
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
